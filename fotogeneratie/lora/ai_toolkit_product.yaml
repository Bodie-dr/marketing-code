# =====================================================================
# ai-toolkit config - product-LoRA op Qwen-Image
# =====================================================================
# Gebruik:
#   1. Zet je dataset (foto's + .txt captions) in /workspace/dataset
#   2. Controleer de dataset eerst met check_dataset.py
#   3. Start op RunPod:  bash runpod_train.sh   (zie README.md in deze map)
#      (of laad dit bestand in de ai-toolkit web-UI)
#
# Gecontroleerd tegen config/examples/train_lora_qwen_image_24gb.yaml van
# ostris/ai-toolkit (okt 2026). ai-toolkit wordt vaak bijgewerkt: vergelijk
# bij fouten opnieuw met dat voorbeeld en neem gewijzigde veldnamen over.
#
# GPU-keuze op RunPod (zie ook 'model:' onderaan):
#   - 48 GB (A6000, L40S, A40)  -> aanbevolen, deze instellingen werken direct
#   - 80 GB (A100, H100)        -> zet quantize op false voor iets betere kwaliteit
#   - 24 GB (RTX 4090)          -> zet de 24GB-regels bij 'model:' aan
# =====================================================================

job: extension
config:
  name: "tvbprod_qwen_image_v1"          # naam van deze trainingsrun (versie ophogen bij elke nieuwe poging)
  process:
    - type: "sd_trainer"
      training_folder: "/workspace/output"   # hier komen checkpoints + testbeelden (zet op je network volume!)
      device: cuda:0
      # trigger_word werkt NIET samen met cache_text_embeddings (staat aan bij 'train:').
      # Het triggerwoord moet daarom vooraan in elke caption staan: "tvbprod, ...".
      # check_dataset.py controleert dat.
      # trigger_word: "tvbprod"

      network:
        type: "lora"
        linear: 32                           # rank. 16 = lichter/minder detail, 32 = goed voor productdetails
        linear_alpha: 32

      save:
        dtype: float16
        save_every: 250                      # elke 250 stappen een checkpoint, zodat je de beste kunt kiezen
        max_step_saves_to_keep: 12           # bewaar genoeg checkpoints om terug te kunnen

      datasets:
        - folder_path: "/workspace/dataset"
          caption_ext: "txt"
          caption_dropout_rate: 0.05         # soms caption weglaten -> robuuster model
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 768, 1024 ]          # traint op meerdere formaten; foto's worden automatisch in 'buckets' gesorteerd

      train:
        batch_size: 1
        steps: 3000                          # startwaarde; de beste checkpoint ligt vaak tussen 1500 en 3000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false            # tekstencoder niet trainen (niet nodig, kost veel geheugen)
        gradient_checkpointing: true         # bespaart VRAM
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4                             # te snel overfit? probeer 5e-5. Leert te weinig? probeer 2e-4
        dtype: bf16
        cache_text_embeddings: true          # sneller, en scheelt geheugen
        ema_config:
          use_ema: false

      model:
        name_or_path: "Qwen/Qwen-Image"
        arch: "qwen_image"
        # Geheugen-instellingen:
        #  - 48 GB: zoals hieronder (8-bit model, standaard qfloat8)
        #  - 80 GB: quantize: false voor iets betere kwaliteit
        #  - 24 GB: haal het # weg voor de twee qtype-regels en zet low_vram op true
        #           (3-bit model met 'accuracy recovery adapter', anders geheugen vol)
        quantize: true
        # qtype: "uint3|ostris/accuracy_recovery_adapters/qwen_image_torchao_uint3.safetensors"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false

      sample:
        sampler: "flowmatch"
        sample_every: 250                    # elke 250 stappen testbeelden, om voortgang te beoordelen
        width: 1024
        height: 1024
        seed: 42
        walk_seed: false                     # vaste seed -> testbeelden zijn eerlijk vergelijkbaar tussen checkpoints
        guidance_scale: 4
        sample_steps: 25
        # Testprompts: bewust situaties die NIET in de dataset zitten.
        # Pas de omgevingen aan aan jullie product en gebruik.
        prompts:
          # 1-3: nieuwe omgevingen -> klopt het product buiten de trainingsfoto's?
          - "tvbprod, standing on a wooden table in a bright Scandinavian kitchen, morning sunlight through the window"
          - "tvbprod, outdoors on a rocky beach at sunset, warm low light, wide shot"
          - "tvbprod, in a modern glass office lobby, cool daylight, people walking in the background, slightly blurred"
          # 4-5: nieuwe hoeken -> heeft het model de 3D-vorm geleerd?
          - "tvbprod, seen from directly above, on a concrete floor, soft overcast light"
          - "tvbprod, seen from a low angle close to the ground, dramatic sky behind it"
          # 6: close-up -> kloppen details, logo en materialen?
          - "tvbprod, extreme close-up of the details, shallow depth of field, studio lighting"
          # 7: in gebruik door een persoon -> handen en schaal
          - "tvbprod, being used by a woman in a green jacket in a city park, natural daylight"
          # 8: leeg studio-shot -> 'schone' weergave van het product
          - "tvbprod, alone on a plain light grey background, soft even studio lighting, product photo"
          # 9: ZONDER triggerwoord -> controle: hier hoort jullie product NIET te verschijnen.
          #    Verschijnt het toch? Dan 'lekt' de LoRA en is hij overgetraind.
          - "a wooden table in a bright kitchen, morning sunlight through the window"
        neg: ""

meta:
  name: "[name]"
  version: "1.0"
